[endpoint]
kind = "mock"
requests = [
  { model = "morgan-fetch", messages = [{ content = "use echo" }] },
]

[providers.gpu]
kind = "mock"
turns = [
  { tool_call = { id = "call-1", name = "echo", arguments = '{"input":"hi"}' } },
  { content = "done" },
]

[tooling.filesystem]
kind = "mock"
tools = [{ name = "echo", description = "echo back", input_schema = {} }]
tool_calls = [{ name = "echo", result = "hi" }]

[runtime.js]
kind = "js"

[[agents]]
name = "corm"
runtime = "js"
script = "../../dist/index.js"

[assertions.corm]
outcome = "asserted"
events = [
  { kind = "inbound", event = "endpoint-message" },
  { kind = "call", op = "chat" },
  { kind = "call", op = "call_tool_blocking" },
  { kind = "call", op = "chat" },
]