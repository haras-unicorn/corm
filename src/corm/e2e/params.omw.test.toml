[endpoint]
requests = [
  { model = "corm", session_id = "corm", messages = [
    { content = "hi" },
  ], params = { temperature = 0.2 } },
]

[providers.gpu]
turns = [{ content = "hello" }]

[memory.corm]
"corm-state" = "{}"

[assertions.corm]
outcome = "asserted"
events = [
  { kind = "inbound", event = "endpoint-message" },
  { kind = "call", op = "chat_stream", detail = { params = { temperature = 0.2 } } },
]
