[endpoint]
requests = [{ model = "corm", messages = [{ content = "use a client tool" }] }]

[providers.gpu]
turns = [
  { tool_call = { id = "call-1", name = "client__thing", arguments = "{}" } },
]

[memory.corm]
"corm-state" = "{}"

[assertions.corm]
outcome = "asserted"
events = [
  { kind = "inbound", event = "endpoint-message" },
  { kind = "call", op = "^chat" },
  { kind = "inbound", event = "chat-end" },
]
