# An empty configured model falls back to the provider's first listed model.
#
# Crucial: the provider is called with `mock-model`, not an empty name.
[endpoint]
requests = [
  { model = "corm", session_id = "corm", messages = [
    { content = "hi" },
  ] },
]

[providers.gpu]
models = ["mock-model"]
turns = [{ content = "hello" }]

[memory.corm]
corm_config = { model = "" }
corm_state = {}

[assertions.corm]
outcome = "asserted"
events = [
  { kind = "inbound", event = "endpoint-message" },
  { kind = "call", op = "chat_stream", detail = { model = "^mock-model$" } },
]
