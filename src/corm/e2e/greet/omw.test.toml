[endpoint]
kind = "mock"
requests = [
  { model = "morgan-fetch", messages = [{ content = "say hi" }] },
]

[providers.gpu]
kind = "mock"
turns = [{ content = "hi" }]

[runtime.js]
kind = "js"

[[agents]]
name = "corm"
runtime = "js"
script = "../../dist/index.js"

[assertions.corm]
outcome = "asserted"
events = [
  { kind = "inbound", event = "endpoint-message" },
  { kind = "call", op = "chat" },
]