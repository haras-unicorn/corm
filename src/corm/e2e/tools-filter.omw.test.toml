# The configured `tools` subset gates what the model is offered: an empty subset
# exposes no tools, so a `corm__*` call corm does not offer is not executed and is
# not handed to the client either. corm answers it with an error `tool`
# message and re-prompts the model once.
#
# Crucial: with `tools = []` the same `corm__filesystem__echo` call that
# `tool.omw.test.toml` would execute (a `call_tool`) instead produces a second
# `chat_stream` carrying an error `tool` message -- proving the subset filters
# the window's tool list rather than merely annotating it, and that no call ever
# reaches the endpoint client.
[endpoint]
requests = [
  { model = "corm", session_id = "corm", messages = [
    { content = "use echo" },
  ] },
]

[providers.gpu]
turns = [
  { tool_calls = [
    { id = "call-1", name = "corm__filesystem__echo", arguments = '{"input":"hi"}' },
  ] },
  { content = "done" },
]

[memory.corm]
corm_config = { tools = [] }
corm_state = {}

[tooling.filesystem]
tools = [{ name = "echo", description = "echo back", input_schema = {} }]
tool_calls = [{ name = "echo", result = "hi" }]

[assertions.corm]
outcome = "asserted"
events = [
  { kind = "inbound", event = "endpoint-message" },
  { kind = "call", op = "chat_stream" },
  { kind = "call", op = "chat_stream", detail = { messages = [
    { role = "tool", content = '^Tool error \(corm__filesystem__echo #call-1\):' },
  ] } },
  { kind = "inbound", event = "chat-end" },
]
