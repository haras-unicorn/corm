# The configured `tools` subset gates what the model is offered: an empty subset
# exposes no tools, so a `corm__*` call a tooling owns is not recognized and is
# forwarded to the client instead of being executed by corm.
#
# Crucial: with `tools = []` the same `corm__filesystem__echo` call that
# `tool.omw.test.toml` would execute (a `call_tool`) instead reaches the endpoint
# as a forwarded tool call (`stream_endpoint`), proving the subset filters the
# window's tool list rather than merely annotating it.
[endpoint]
requests = [
  { model = "corm", session_id = "corm", messages = [
    { content = "use echo" },
  ] },
]

[providers.gpu]
turns = [
  { tool_call = { id = "call-1", name = "corm__filesystem__echo", arguments = '{"input":"hi"}' } },
]

[memory.corm]
corm_config = { tools = [] }
corm_state = {}

[tooling.filesystem]
tools = [{ name = "echo", description = "echo back", input_schema = {} }]
tool_calls = [{ name = "echo", result = "hi" }]

[assertions.corm]
outcome = "asserted"
events = [
  { kind = "inbound", event = "endpoint-message" },
  { kind = "call", op = "chat_stream" },
  { kind = "inbound", event = "chat-end" },
  { kind = "call", op = "stream_endpoint" },
]
