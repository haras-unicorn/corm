[endpoint]
requests = [
  { model = "corm", session_id = "corm", messages = [
    { content = "use add" },
  ] },
]

[providers.gpu]
turns = [
  { tool_call = { id = "call-1", name = "corm__add", arguments = '{"a":1,"b":2}' } },
  { content = "done" },
]

[memory.corm]
"corm-state" = "{}"

[tooling.filesystem]
tools = [{ name = "add", description = "add", input_schema = {} }]
tool_calls = [
  { name = "add", result = "raw", structured_content = { content = "structured!" } },
]

[assertions.corm]
outcome = "asserted"
events = [
  { kind = "inbound", event = "endpoint-message" },
  { kind = "call", op = "chat_stream" },
  { kind = "call", op = "call_tool" },
  { kind = "call", op = "chat_stream", detail = { messages = [
    { role = "tool", content = "^structured!$" },
  ] } },
  { kind = "inbound", event = "chat-end" },
]
