# The async MCP tool loop: a structured `corm__*` call is executed through the
# tooling layer, its result is fed back, and the model is re-prompted.
#
# Crucial: `call_tool` then `tool-result` then a second `chat_stream` carrying the
# tool message -- never a blocking call.
[endpoint]
requests = [
  { model = "corm", session_id = "corm", messages = [
    { content = "use echo" },
  ] },
]

[providers.gpu]
turns = [
  { tool_call = { id = "call-1", name = "corm__filesystem__echo", arguments = '{"input":"hi"}' } },
  { content = "done" },
]

[memory.corm]
corm_state = {}

[tooling.filesystem]
tools = [{ name = "echo", description = "echo back", input_schema = {} }]
tool_calls = [{ name = "echo", result = "hi" }]

[assertions.corm]
outcome = "asserted"
events = [
  { kind = "inbound", event = "endpoint-message" },
  { kind = "call", op = "chat_stream" },
  { kind = "call", op = "call_tool" },
  { kind = "inbound", event = "tool-result" },
  { kind = "call", op = "chat_stream" },
  { kind = "inbound", event = "chat-end" },
]
