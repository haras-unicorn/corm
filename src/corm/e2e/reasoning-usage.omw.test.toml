[endpoint]
requests = [
  { model = "corm", session_id = "corm", messages = [
    { content = "think" },
  ] },
]

[providers.gpu]
turns = [
  { reasoning = "hmm", usage = { prompt_tokens = 3, completion_tokens = 5, total_tokens = 8 } },
]

[memory.corm]
"corm-state" = "{}"

[assertions.corm]
outcome = "asserted"
events = [
  { kind = "inbound", event = "endpoint-message" },
  { kind = "call", op = "chat_stream" },
  { kind = "call", op = "stream_endpoint", detail = { reasoning = "^hmm$" } },
  { kind = "call", op = "stream_endpoint", detail = { usage = { prompt_tokens = 3, completion_tokens = 5 } } },
  { kind = "inbound", event = "chat-end" },
]
