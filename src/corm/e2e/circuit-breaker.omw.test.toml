# The same tool call with the same arguments repeated to `circuitBreakerLimit`
# trips the breaker: the duplicate exchanges are dropped and `circuitBreakerHint`
# is appended so the model changes approach instead of looping.
#
# Crucial: the hint is present on the next provider call, and the tool ran at
# most `circuitBreakerLimit` times.
[endpoint]
requests = [
  { model = "corm", session_id = "corm", messages = [
    { content = "go" },
  ] },
]

[providers.gpu]
turns = [
  { tool_calls = [
    { id = "call-1", name = "corm__filesystem__echo", arguments = '{"input":"hi"}' },
  ] },
  { tool_calls = [
    { id = "call-2", name = "corm__filesystem__echo", arguments = '{"input":"hi"}' },
  ] },
  { content = "done" },
]

[memory.corm]
corm_config = { circuitBreakerLimit = 2 }
corm_state = {}

[tooling.filesystem]
tools = [{ name = "echo", description = "echo back", input_schema = {} }]
tool_calls = [
  { name = "echo", result = "hi" },
  { name = "echo", result = "hi" },
]

[assertions.corm]
outcome = "asserted"
events = [
  { kind = "call", op = "chat_stream" },
  { kind = "call", op = "call_tool" },
  { kind = "inbound", event = "tool-result" },
  { kind = "call", op = "chat_stream" },
  { kind = "call", op = "call_tool" },
  { kind = "inbound", event = "tool-result" },
  { kind = "call", op = "chat_stream", detail = { messages = [
    { role = "user", content = "^⟦runtime⟧\\n\\nYou have called the same tool" },
  ] } },
]
