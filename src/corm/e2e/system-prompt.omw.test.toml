# The configured `prompt` is injected as the leading system message on every
# provider call (here both the tool turn and the re-prompt), while the stored
# window stays prompt-free.
[endpoint]
requests = [
  { model = "corm", session_id = "corm", messages = [
    { content = "use echo" },
  ] },
]

[providers.gpu]
turns = [
  { tool_call = { id = "call-1", name = "corm__filesystem__echo", arguments = '{"input":"hi"}' } },
  { content = "done" },
]

[memory.corm]
corm_config = { model = "model", prompt = "be terse" }
corm_state = {}

[tooling.filesystem]
tools = [{ name = "echo", description = "echo back", input_schema = {} }]
tool_calls = [{ name = "echo", result = "hi" }]

[assertions.corm]
outcome = "asserted"
events = [
  { kind = "inbound", event = "endpoint-message" },
  { kind = "call", op = "chat_stream", detail = { messages = [
    { role = "system", content = "The following is your root persona\\.\\n\\nbe terse$" },
  ] } },
  { kind = "call", op = "call_tool" },
  { kind = "call", op = "chat_stream", detail = { messages = [
    { role = "system", content = "The following is your root persona\\.\\n\\nbe terse$" },
  ] } },
  { kind = "inbound", event = "chat-end" },
]
