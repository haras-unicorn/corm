name = "search_pull_requests"

[tooling.github.tools.input_schema]
required = ["query"]
type = "object"

[tooling.github.tools.input_schema.properties.order]
description = "Sort order"
enum = ["asc", "desc"]
type = "string"

[tooling.github.tools.input_schema.properties.owner]
description = "Optional repository owner. If provided with repo, only pull requests for this repository are listed."
type = "string"

[tooling.github.tools.input_schema.properties.page]
description = "Page number for pagination (min 1)"
minimum = 1
type = "number"

[tooling.github.tools.input_schema.properties.perPage]
description = "Results per page for pagination (min 1, max 100)"
maximum = 100
minimum = 1
type = "number"

[tooling.github.tools.input_schema.properties.query]
description = "Search query using GitHub pull request search syntax"
type = "string"

[tooling.github.tools.input_schema.properties.repo]
description = "Optional repository name. If provided with owner, only pull requests for this repository are listed."
type = "string"

[tooling.github.tools.input_schema.properties.sort]
description = "Sort field by number of matches of categories, defaults to best match"
enum = [
  "comments",
  "reactions",
  "reactions-+1",
  "reactions--1",
  "reactions-smile",
  "reactions-thinking_face",
  "reactions-heart",
  "reactions-tada",
  "interactions",
  "created",
  "updated",
]
type = "string"

