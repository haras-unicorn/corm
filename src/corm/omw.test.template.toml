[tooling.nixos.tools.input_schema.properties.version]
default = ""
description = "Specific version to find"
type = "string"

[tooling.nixos.tools.output_schema]
required = ["result"]
type = "object"
x-fastmcp-wrap-result = true

[tooling.nixos.tools.output_schema.properties.result]
type = "string"

