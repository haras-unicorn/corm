  "delete_pending",
  "resolve_thread",
  "unresolve_thread",
]
type = "string"

[tooling.github.tools.input_schema.properties.owner]
description = "Repository owner"
type = "string"

[tooling.github.tools.input_schema.properties.pullNumber]
