[tooling.filesystem.initial_resource_contents]

[[tooling.filesystem.tools]]
description = "Read the complete contents of a file as text. DEPRECATED: Use read_text_file instead."
name = "read_file"

[tooling.filesystem.tools.input_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["path"]
type = "object"

[tooling.filesystem.tools.input_schema.properties.head]
description = "If provided, returns only the first N lines of the file"
type = "number"

[tooling.filesystem.tools.input_schema.properties.path]
type = "string"

[tooling.filesystem.tools.input_schema.properties.tail]
description = "If provided, returns only the last N lines of the file"
type = "number"

[tooling.filesystem.tools.output_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["content"]
type = "object"

[tooling.filesystem.tools.output_schema.properties.content]
type = "string"

[[tooling.filesystem.tools]]
description = "Read the complete contents of a file from the file system as text. Handles various text encodings and provides detailed error messages if the file cannot be read. Use this tool when you need to examine the contents of a single file. Use the 'head' parameter to read only the first N lines of a file, or the 'tail' parameter to read only the last N lines of a file. Operates on the file as text regardless of extension. Only works within allowed directories."
name = "read_text_file"

[tooling.filesystem.tools.input_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["path"]
type = "object"

[tooling.filesystem.tools.input_schema.properties.head]
description = "If provided, returns only the first N lines of the file"
type = "number"

[tooling.filesystem.tools.input_schema.properties.path]
type = "string"

[tooling.filesystem.tools.input_schema.properties.tail]
description = "If provided, returns only the last N lines of the file"
type = "number"

[tooling.filesystem.tools.output_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["content"]
type = "object"

[tooling.filesystem.tools.output_schema.properties.content]
type = "string"

[[tooling.filesystem.tools]]
description = "Read an image or audio file. Returns the base64 encoded data and MIME type. Only works within allowed directories."
name = "read_media_file"

[tooling.filesystem.tools.input_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["path"]
type = "object"

[tooling.filesystem.tools.input_schema.properties.path]
type = "string"

[tooling.filesystem.tools.output_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["content"]
type = "object"

[tooling.filesystem.tools.output_schema.properties.content]
type = "array"

[tooling.filesystem.tools.output_schema.properties.content.items]
additionalProperties = false
required = ["type", "data", "mimeType"]
type = "object"

[tooling.filesystem.tools.output_schema.properties.content.items.properties.data]
type = "string"

[tooling.filesystem.tools.output_schema.properties.content.items.properties.mimeType]
type = "string"

[tooling.filesystem.tools.output_schema.properties.content.items.properties.type]
enum = ["image", "audio", "blob"]
type = "string"

[[tooling.filesystem.tools]]
description = "Read the contents of multiple files simultaneously. This is more efficient than reading files one by one when you need to analyze or compare multiple files. Each file's content is returned with its path as a reference. Failed reads for individual files won't stop the entire operation. Only works within allowed directories."
name = "read_multiple_files"

[tooling.filesystem.tools.input_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["paths"]
type = "object"

[tooling.filesystem.tools.input_schema.properties.paths]
description = "Array of file paths to read. Each path must be a string pointing to a valid file within allowed directories."
minItems = 1
type = "array"

[tooling.filesystem.tools.input_schema.properties.paths.items]
type = "string"

[tooling.filesystem.tools.output_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["content"]
type = "object"

[tooling.filesystem.tools.output_schema.properties.content]
type = "string"

[[tooling.filesystem.tools]]
description = "Create a new file or completely overwrite an existing file with new content. Use with caution as it will overwrite existing files without warning. Handles text content with proper encoding. Only works within allowed directories."
name = "write_file"

[tooling.filesystem.tools.input_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["path", "content"]
type = "object"

[tooling.filesystem.tools.input_schema.properties.content]
type = "string"

[tooling.filesystem.tools.input_schema.properties.path]
type = "string"

[tooling.filesystem.tools.output_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["content"]
type = "object"

[tooling.filesystem.tools.output_schema.properties.content]
type = "string"

[[tooling.filesystem.tools]]
description = "Make line-based edits to a text file. Each edit replaces exact line sequences with new content. Returns a git-style diff showing the changes made. Only works within allowed directories."
name = "edit_file"

[tooling.filesystem.tools.input_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["path", "edits"]
type = "object"

[tooling.filesystem.tools.input_schema.properties.dryRun]
default = false
description = "Preview changes using git-style diff format"
type = "boolean"

[tooling.filesystem.tools.input_schema.properties.edits]
type = "array"

[tooling.filesystem.tools.input_schema.properties.edits.items]
additionalProperties = false
required = ["oldText", "newText"]
type = "object"

[tooling.filesystem.tools.input_schema.properties.edits.items.properties.newText]
description = "Text to replace with"
type = "string"

[tooling.filesystem.tools.input_schema.properties.edits.items.properties.oldText]
description = "Text to search for - must match exactly"
type = "string"

[tooling.filesystem.tools.input_schema.properties.path]
type = "string"

[tooling.filesystem.tools.output_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["content"]
type = "object"

[tooling.filesystem.tools.output_schema.properties.content]
type = "string"

[[tooling.filesystem.tools]]
description = "Create a new directory or ensure a directory exists. Can create multiple nested directories in one operation. If the directory already exists, this operation will succeed silently. Perfect for setting up directory structures for projects or ensuring required paths exist. Only works within allowed directories."
name = "create_directory"

[tooling.filesystem.tools.input_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["path"]
type = "object"

[tooling.filesystem.tools.input_schema.properties.path]
type = "string"

[tooling.filesystem.tools.output_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["content"]
type = "object"

[tooling.filesystem.tools.output_schema.properties.content]
type = "string"

[[tooling.filesystem.tools]]
description = "Get a detailed listing of all files and directories in a specified path. Results clearly distinguish between files and directories with [FILE] and [DIR] prefixes. This tool is essential for understanding directory structure and finding specific files within a directory. Only works within allowed directories."
name = "list_directory"

[tooling.filesystem.tools.input_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["path"]
type = "object"

[tooling.filesystem.tools.input_schema.properties.path]
type = "string"

[tooling.filesystem.tools.output_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["content"]
type = "object"

[tooling.filesystem.tools.output_schema.properties.content]
type = "string"

[[tooling.filesystem.tools]]
description = "Get a detailed listing of all files and directories in a specified path, including sizes. Results clearly distinguish between files and directories with [FILE] and [DIR] prefixes. This tool is useful for understanding directory structure and finding specific files within a directory. Only works within allowed directories."
name = "list_directory_with_sizes"

[tooling.filesystem.tools.input_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["path"]
type = "object"

[tooling.filesystem.tools.input_schema.properties.path]
type = "string"

[tooling.filesystem.tools.input_schema.properties.sortBy]
default = "name"
description = "Sort entries by name or size"
enum = ["name", "size"]
type = "string"

[tooling.filesystem.tools.output_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["content"]
type = "object"

[tooling.filesystem.tools.output_schema.properties.content]
type = "string"

[[tooling.filesystem.tools]]
description = "Get a recursive tree view of files and directories as a JSON structure. Each entry includes 'name', 'type' (file/directory), and 'children' for directories. Files have no children array, while directories always have a children array (which may be empty). The output is formatted with 2-space indentation for readability. Only works within allowed directories."
name = "directory_tree"

[tooling.filesystem.tools.input_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["path"]
type = "object"

[tooling.filesystem.tools.input_schema.properties.excludePatterns]
default = []
type = "array"

[tooling.filesystem.tools.input_schema.properties.excludePatterns.items]
type = "string"

[tooling.filesystem.tools.input_schema.properties.path]
type = "string"

[tooling.filesystem.tools.output_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["content"]
type = "object"

[tooling.filesystem.tools.output_schema.properties.content]
type = "string"

[[tooling.filesystem.tools]]
description = "Move or rename files and directories. Can move files between directories and rename them in a single operation. If the destination exists, the operation will fail. Works across different directories and can be used for simple renaming within the same directory. Both source and destination must be within allowed directories."
name = "move_file"

[tooling.filesystem.tools.input_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["source", "destination"]
type = "object"

[tooling.filesystem.tools.input_schema.properties.destination]
type = "string"

[tooling.filesystem.tools.input_schema.properties.source]
type = "string"

[tooling.filesystem.tools.output_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["content"]
type = "object"

[tooling.filesystem.tools.output_schema.properties.content]
type = "string"

[[tooling.filesystem.tools]]
description = "Recursively search for files and directories matching a pattern. The patterns should be glob-style patterns that match paths relative to the working directory. Use pattern like '*.ext' to match files in current directory, and '**/*.ext' to match files in all subdirectories. Returns full paths to all matching items. Great for finding files when you don't know their exact location. Only searches within allowed directories."
name = "search_files"

[tooling.filesystem.tools.input_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["path", "pattern"]
type = "object"

[tooling.filesystem.tools.input_schema.properties.excludePatterns]
default = []
type = "array"

[tooling.filesystem.tools.input_schema.properties.excludePatterns.items]
type = "string"

[tooling.filesystem.tools.input_schema.properties.path]
type = "string"

[tooling.filesystem.tools.input_schema.properties.pattern]
type = "string"

[tooling.filesystem.tools.output_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["content"]
type = "object"

[tooling.filesystem.tools.output_schema.properties.content]
type = "string"

[[tooling.filesystem.tools]]
description = "Retrieve detailed metadata about a file or directory. Returns comprehensive information including size, creation time, last modified time, permissions, and type. This tool is perfect for understanding file characteristics without reading the actual content. Only works within allowed directories."
name = "get_file_info"

[tooling.filesystem.tools.input_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["path"]
type = "object"

[tooling.filesystem.tools.input_schema.properties.path]
type = "string"

[tooling.filesystem.tools.output_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["content"]
type = "object"

[tooling.filesystem.tools.output_schema.properties.content]
type = "string"

[[tooling.filesystem.tools]]
description = "Returns the list of directories that this server is allowed to access. Subdirectories within these allowed directories are also accessible. Use this to understand which directories and their nested paths are available before trying to access files."
name = "list_allowed_directories"

[tooling.filesystem.tools.input_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
type = "object"

[tooling.filesystem.tools.input_schema.properties]

[tooling.filesystem.tools.output_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["content"]
type = "object"

[tooling.filesystem.tools.output_schema.properties.content]
type = "string"

[tooling.git]
initial_resource_list = []
kind = "mock"
tool_calls = []

[tooling.git.initial_resource_contents]

[[tooling.git.tools]]
description = "Stage files for commit. Add file contents to the staging area (index) to prepare for the next commit."
name = "git_add"

[tooling.git.tools.input_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
type = "object"

[tooling.git.tools.input_schema.properties.all]
default = false
description = "Include all items (varies by operation)."
type = "boolean"

[tooling.git.tools.input_schema.properties.force]
default = false
description = "Allow adding otherwise ignored files."
type = "boolean"

[tooling.git.tools.input_schema.properties.path]
default = "."
description = "Path to the Git repository. Defaults to session working directory set via git_set_working_dir."
type = "string"

[tooling.git.tools.input_schema.properties.paths]
default = []
description = 'Array of file or directory paths to stage (relative to repository root). Use ["."] to stage all changes. Can be omitted when all or update is true.'
type = "array"

[tooling.git.tools.input_schema.properties.paths.items]
type = "string"

[tooling.git.tools.input_schema.properties.update]
default = false
description = "Stage only modified and deleted files (skip untracked files)."
type = "boolean"

[tooling.git.tools.output_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["success", "stagedFiles", "totalFiles", "status"]
type = "object"

[tooling.git.tools.output_schema.properties.stagedFiles]
description = "Files that were successfully staged."
type = "array"

[tooling.git.tools.output_schema.properties.stagedFiles.items]
type = "string"

[tooling.git.tools.output_schema.properties.status]
additionalProperties = false
description = "Repository status after staging files."
required = [
  "current_branch",
  "staged_changes",
  "unstaged_changes",
  "untracked_files",
  "conflicted_files",
  "is_clean",
]
type = "object"

[tooling.git.tools.output_schema.properties.status.properties.conflicted_files]
description = "Files with conflicts."
type = "array"

[tooling.git.tools.output_schema.properties.status.properties.conflicted_files.items]
type = "string"

[tooling.git.tools.output_schema.properties.status.properties.current_branch]
description = "Current branch name after staging."

[[tooling.git.tools.output_schema.properties.status.properties.current_branch.anyOf]]
type = "string"

[[tooling.git.tools.output_schema.properties.status.properties.current_branch.anyOf]]
type = "null"

[tooling.git.tools.output_schema.properties.status.properties.is_clean]
description = "Whether working directory is clean (ready to commit)."
type = "boolean"

[tooling.git.tools.output_schema.properties.status.properties.staged_changes]
description = "All staged changes after this operation."
type = "object"

[tooling.git.tools.output_schema.properties.status.properties.staged_changes.additionalProperties]

[tooling.git.tools.output_schema.properties.status.properties.staged_changes.propertyNames]
type = "string"

[tooling.git.tools.output_schema.properties.status.properties.unstaged_changes]
description = "Remaining unstaged changes."
type = "object"

[tooling.git.tools.output_schema.properties.status.properties.unstaged_changes.additionalProperties]

[tooling.git.tools.output_schema.properties.status.properties.unstaged_changes.propertyNames]
type = "string"

[tooling.git.tools.output_schema.properties.status.properties.untracked_files]
description = "Remaining untracked files."
type = "array"

[tooling.git.tools.output_schema.properties.status.properties.untracked_files.items]
type = "string"

[tooling.git.tools.output_schema.properties.success]
description = "Indicates if the operation was successful."
type = "boolean"

[tooling.git.tools.output_schema.properties.totalFiles]
description = "Total number of files staged."
maximum = 9007199254740991
minimum = -9007199254740991
type = "integer"

[[tooling.git.tools]]
description = "Show line-by-line authorship information for a file, displaying who last modified each line and when. For large files, use startLine/endLine to limit output."
name = "git_blame"

[tooling.git.tools.input_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["filePath"]
type = "object"

[tooling.git.tools.input_schema.properties.endLine]
description = "End line number (1-indexed)."
maximum = 9007199254740991
minimum = 1
type = "integer"

[tooling.git.tools.input_schema.properties.filePath]
description = "Path to the file to blame (relative to repository root)."
minLength = 1
type = "string"

[tooling.git.tools.input_schema.properties.ignoreWhitespace]
default = false
description = "Ignore whitespace changes."
type = "boolean"

[tooling.git.tools.input_schema.properties.path]
default = "."
description = "Path to the Git repository. Defaults to session working directory set via git_set_working_dir."
type = "string"

[tooling.git.tools.input_schema.properties.startLine]
description = "Start line number (1-indexed)."
maximum = 9007199254740991
minimum = 1
type = "integer"

[tooling.git.tools.output_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["success", "filePath", "lines", "totalLines"]
type = "object"

[tooling.git.tools.output_schema.properties.filePath]
description = "The file that was blamed."
type = "string"

[tooling.git.tools.output_schema.properties.lines]
description = "Array of blame information for each line."
type = "array"

[tooling.git.tools.output_schema.properties.lines.items]
additionalProperties = false
required = ["lineNumber", "commitHash", "author", "timestamp", "content"]
type = "object"

[tooling.git.tools.output_schema.properties.lines.items.properties.author]
description = "Author who last modified this line."
type = "string"

[tooling.git.tools.output_schema.properties.lines.items.properties.commitHash]
description = "Full commit hash of the last change to this line."
type = "string"

[tooling.git.tools.output_schema.properties.lines.items.properties.content]
description = "The actual content/text of this line."
type = "string"

[tooling.git.tools.output_schema.properties.lines.items.properties.lineNumber]
description = "Line number in the file (1-indexed)."
maximum = 9007199254740991
minimum = 1
type = "integer"

[tooling.git.tools.output_schema.properties.lines.items.properties.timestamp]
description = "Unix timestamp of the commit that last modified this line."
maximum = 9007199254740991
minimum = -9007199254740991
type = "integer"

[tooling.git.tools.output_schema.properties.success]
description = "Indicates if the operation was successful."
type = "boolean"

[tooling.git.tools.output_schema.properties.totalLines]
description = "Total number of lines in the output."
maximum = 9007199254740991
minimum = -9007199254740991
type = "integer"

[[tooling.git.tools]]
description = "Manage branches: list all branches, show current branch, create a new branch, delete a branch, or rename a branch."
name = "git_branch"

[tooling.git.tools.input_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
type = "object"

[tooling.git.tools.input_schema.properties.all]
default = false
description = "For list mode: show both local and remote branches."
type = "boolean"

[tooling.git.tools.input_schema.properties.branchName]
description = "Branch name for create/delete/rename operations."
maxLength = 255
minLength = 1
pattern = '^[^~^:?*\[\\]+$'
type = "string"

[tooling.git.tools.input_schema.properties.force]
default = false
description = "Force the operation, bypassing safety checks."
type = "boolean"

[tooling.git.tools.input_schema.properties.limit]
description = "For list mode: cap the number of branches returned (applied at the git command). Use on repos with many branches."
maximum = 1000
minimum = 1
type = "integer"

[tooling.git.tools.input_schema.properties.merged]
description = "For list mode: show only branches merged into HEAD (true) or specified commit (string)."

[[tooling.git.tools.input_schema.properties.merged.anyOf]]
type = "boolean"

[[tooling.git.tools.input_schema.properties.merged.anyOf]]
description = "Commit reference: full/short hash, branch name, tag name, or relative ref (HEAD~1)."
minLength = 1
type = "string"

[tooling.git.tools.input_schema.properties.mode]
default = "list"
description = "The branch operation to perform."
enum = ["list", "create", "delete", "rename", "show-current"]
type = "string"

[tooling.git.tools.input_schema.properties.newBranchName]
description = "New branch name for rename operation."
maxLength = 255
minLength = 1
pattern = '^[^~^:?*\[\\]+$'
type = "string"

[tooling.git.tools.input_schema.properties.noMerged]
description = "For list mode: show only branches not merged into HEAD (true) or specified commit (string)."

[[tooling.git.tools.input_schema.properties.noMerged.anyOf]]
type = "boolean"

[[tooling.git.tools.input_schema.properties.noMerged.anyOf]]
description = "Commit reference: full/short hash, branch name, tag name, or relative ref (HEAD~1)."
minLength = 1
type = "string"

[tooling.git.tools.input_schema.properties.path]
default = "."
description = "Path to the Git repository. Defaults to session working directory set via git_set_working_dir."
type = "string"

[tooling.git.tools.input_schema.properties.remote]
default = false
description = "For list mode: show only remote branches."
type = "boolean"

[tooling.git.tools.input_schema.properties.startPoint]
description = "Starting point (commit/branch) for new branch creation."
minLength = 1
type = "string"

[tooling.git.tools.output_schema]
"$schema" = "http://json-schema.org/draft-07/schema#"
additionalProperties = false
required = ["success", "mode"]
type = "object"

[tooling.git.tools.output_schema.properties.branches]
description = "List of branches (for list mode)."
type = "array"

[tooling.git.tools.output_schema.properties.branches.items]
additionalProperties = false
required = ["name", "current", "commitHash"]
type = "object"

[tooling.git.tools.output_schema.properties.branches.items.properties.ahead]
description = "Commits ahead of upstream."
maximum = 9007199254740991
minimum = -9007199254740991
type = "integer"

[tooling.git.tools.output_schema.properties.branches.items.properties.behind]
description = "Commits behind upstream."
maximum = 9007199254740991
minimum = -9007199254740991
type = "integer"

[tooling.git.tools.output_schema.properties.branches.items.properties.commitHash]
description = "Commit hash the branch points to."
type = "string"

[tooling.git.tools.output_schema.properties.branches.items.properties.current]
description = "True if this is the current branch."
type = "boolean"

[tooling.git.tools.output_schema.properties.branches.items.properties.name]
description = "Branch name."
type = "string"

[tooling.git.tools.output_schema.properties.branches.items.properties.upstream]
description = "Upstream branch name if configured."
type = "string"

[tooling.git.tools.output_schema.properties.currentBranch]
description = "Name of current branch."
type = "string"

[tooling.git.tools.output_schema.properties.message]
